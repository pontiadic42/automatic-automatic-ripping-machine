{% block help %}
    <div class="tab-pane pt-5" id="help" role="tabpanel" aria-labelledby="help-tab">
        <div class="card">
            <div class="card-header">Get help</div>
            <div class="card-body no-gutters">
                <div class="row">
                    <div class="col-lg-4">
                        <a class="stretched-link text-center" target="_blank" rel="noopener" href="https://github.com/pontiadic42/automatic-automatic-ripping-machine#readme">
                            <img class="rounded mx-auto d-block mt-2" alt="GitHub" src="{{ url_for('static', filename='img/github/GitHub-Mark-120px-plus.png') }}">
                            <label>A2RM on GitHub</label>
                        </a>
                        <p class="text-center arm-faint" style="font-size:13px">Install, settings and what's new</p>
                    </div>
                    <div class="col-lg-4">
                        <a class="stretched-link text-center" target="_blank" rel="noopener" href="https://github.com/pontiadic42/automatic-automatic-ripping-machine/blob/main/docs/ARM-vs-A2RM.md">
                            <img class="rounded mx-auto d-block mt-2" alt="GitHub" src="{{ url_for('static', filename='img/github/GitHub-Mark-120px-plus.png') }}">
                            <label>ARM and A2RM: what's different</label>
                        </a>
                        <p class="text-center arm-faint" style="font-size:13px">Every A2RM setting and what it changes</p>
                    </div>
                    <div class="col-lg-4">
                        <a class="stretched-link text-center" target="_blank" rel="noopener" href="https://github.com/automatic-ripping-machine/automatic-ripping-machine/wiki">
                            <img class="rounded mx-auto d-block mt-2" src="{{ url_for('static', filename='img/github/GitHub-Mark-120px-plus.png') }}" alt="ARM wiki">
                            <label>ARM's wiki</label>
                        </a>
                        <p class="text-center arm-faint" style="font-size:13px">For the parts A2RM didn't change: drives, Docker, MakeMKV.
                            Please don't ask ARM's GitHub or Discord about A2RM.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
